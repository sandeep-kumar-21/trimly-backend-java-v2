spring.application.name=trimly-backend

# Server Configuration (matches NestJS port 4000 so frontend requires 0 changes)
server.port=4000

# Docker PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trimly_db
spring.datasource.username=trimly_user
spring.datasource.password=trimly_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.check-template-location=false

# Docker Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT (JSON Web Token) Security Settings (7 days expiration)
jwt.secret=9a3f5b7e2c8d1a4e6f0b3c5d7e9a1b3c5d7e9a1b3c5d7e9a1b3c5d7e9a1b3c5d
jwt.expiration-ms=604800000

# Application Custom Properties
app.base-url=http://localhost:4000
app.frontend-url=http://localhost:3000
app.short-url-base=http://localhost:4000
app.cors.allowed-origins=http://localhost:3000,https://trimly-frontend.vercel.app

# Swagger OpenAPI Documentation Settings
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Actuator Health Check Settings
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Database Seeder Configuration (Example test account credentials)
seed.user.email=demo@trimly.com
seed.user.password=DemoPassword@123
seed.user.name=Demo User
